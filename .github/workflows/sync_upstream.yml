name: Sync with Upstream

on:
  workflow_dispatch:
    inputs:
      sync_main:
        description: 'Sync main branch with upstream'
        required: true
        default: true
        type: boolean
      merge_to_patched:
        description: 'Merge updated main into patched-worker-clean'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Portkey-AI/gateway.git || true

      - name: Fetch all remotes
        run: |
          git fetch origin
          git fetch upstream

      - name: Sync main with upstream
        if: ${{ inputs.sync_main }}
        run: |
          git checkout main
          git merge upstream/main --ff-only
          git push origin main
        continue-on-error: true
        id: sync_main

      - name: Report main sync failure
        if: ${{ inputs.sync_main && steps.sync_main.outcome == 'failure' }}
        run: |
          echo "::warning::Failed to fast-forward main. Manual merge may be required."
          echo "Run locally:"
          echo "  git fetch upstream"
          echo "  git checkout main"
          echo "  git merge upstream/main"
          echo "  git push origin main"

      - name: Merge main into patched-worker-clean
        if: ${{ inputs.merge_to_patched }}
        id: merge
        run: |
          git checkout patched-worker-clean

          # Attempt merge
          if git merge origin/main --no-edit; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
            git push origin patched-worker-clean
            echo "Successfully merged main into patched-worker-clean"
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            git merge --abort
            echo "::error::Merge failed due to conflicts. Manual resolution required."
          fi

      - name: Create issue on merge failure
        if: ${{ inputs.merge_to_patched && steps.merge.outputs.merge_status == 'conflict' }}
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;

            // Check if there's already an open issue for this
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'merge-conflict'
            });

            if (issues.data.length > 0) {
              console.log('Issue already exists, skipping creation');
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title: 'Merge conflict: patched-worker-clean needs manual update',
              body: `The automated merge of \`main\` into \`patched-worker-clean\` failed due to conflicts.

            ## Manual Resolution Steps

            \`\`\`bash
            # Fetch latest changes
            git fetch origin
            git fetch upstream

            # Update main first
            git checkout main
            git merge upstream/main
            git push origin main

            # Merge main into patched-worker-clean
            git checkout patched-worker-clean
            git merge main

            # Resolve conflicts, then commit
            git add .
            git commit

            # Push when done
            git push origin patched-worker-clean
            \`\`\`

            Close this issue once resolved.`,
              labels: ['merge-conflict']
            });

      - name: Summary
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.sync_main }}" == "true" ]; then
            if [ "${{ steps.sync_main.outcome }}" == "success" ]; then
              echo "- main synced with upstream" >> $GITHUB_STEP_SUMMARY
            else
              echo "- main sync failed (manual merge needed)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ "${{ inputs.merge_to_patched }}" == "true" ]; then
            if [ "${{ steps.merge.outputs.merge_status }}" == "success" ]; then
              echo "- main merged into patched-worker-clean" >> $GITHUB_STEP_SUMMARY
            else
              echo "- patched-worker-clean merge failed (conflicts)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
